<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>特殊字符和字符实体</title>
</head>

<body>
  <h1>字符实体：显示保留字符、不可见字符（常见格式：&+名称缩写+;）</h1>
  <p>字符实体：在 HTML 中，一些字符需要进行转义，才能正确显示。这些字符被称为字符实体。</p>
  <p>例如：标签的开头和结尾：&lt; 小于号，&gt; 大于号，&amp; 与号，&copy; 版权符号，注册商标 &reg; 等。</p>
  <p>属性值的开头和结尾：双引号 &quot; ，单引号 &apos; 。不换行空格 &nbsp;。</p>
</body>

</html>
